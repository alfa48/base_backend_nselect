<!DOCTYPE html><!--  Last Published: Sat Apr 25 2026 22:30:53 GMT+0000 (Coordinated Universal Time)  -->
<html data-wf-page="69ed0d7d7da02af7512eb52a" data-wf-site="69ece585cad09a74baae0d40"
  xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/fragments/head :: head('Ticket individual - Admin')}"></head>

<body>
  <div th:replace="~{layout/fragments/admin-nav :: nav}"></div>
  <section class="section-3 no-shad">
    <div class="horizontal-navigation">
      <div class="contain-this">
        <div class="div-block-455">
          <div class="div-block-456">
            <a href="javascript:history.back()" class="link-5">q</a>
            <div class="text-block-258"
              th:text="'# ' + ${#strings.toUpperCase(#strings.substring(ticket.publicId, 0, 8))}">#5546</div>
          </div>
        </div>
      </div>
    </div>
    <div class="contain-this">
      <div class="div-block-6 _5">
        <div class="w-layout-grid grid-3">
          <div id="w-node-_40601bc3-2220-c362-209c-44ddfe5d07e5-512eb52a">
            <p class="paragraph" th:text="${ticket.conteudo}">Conteúdo do ticket.</p>
          </div>
          <div id="w-node-_40601bc3-2220-c362-209c-44ddfe5d07fa-512eb52a">
            <div class="list-item">
              <div class="list-item-lable">Publicado por</div>
              <div class="list-item" th:text="${ticket.publicadoPorNome != null ? ticket.publicadoPorNome : ''}">
              </div>
            </div>
            <div class="list-item">
              <div class="list-item-lable">Tipo</div>
              <div th:if="${ticket.tipo == 'CANCELAR'}" class="list-item redd">Cancelar subscrição</div>
              <div th:if="${ticket.tipo == 'BUG'}" class="list-item pendente">Bug no sistema</div>
              <div th:if="${ticket.tipo == 'RECLAMACAO'}" class="list-item blue">Reclamação</div>
              <div th:if="${ticket.tipo == 'OUTRO'}" class="list-item outro">Outro</div>
            </div>
            <div class="list-item">
              <div class="list-item-lable">Estado</div>
              <div th:if="${#strings.toLowerCase(ticket.estado) == 'aberto'}" class="list-item redd">Aberto</div>
              <div th:if="${#strings.toLowerCase(ticket.estado) == 'progresso'}" class="list-item blue">Em progresso
              </div>
              <div th:if="${#strings.toLowerCase(ticket.estado) == 'resolvido'}" class="list-item green">Resolvido</div>
            </div>

            <div class="w-form" style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee;">
              <form id="form-status-ticket">
                <input type="hidden" id="ticketId" th:value="${ticket.publicId}">
                <div class="form-field-wrapper">
                  <label for="estado" class="form-field-lable">Alterar Estado</label>
                  <select id="estado" name="estado" class="select-field w-select">
                    <option value="">Selecione...</option>
                    <option value="ABERTO" th:selected="${ticket.estado == 'ABERTO'}">Aberto</option>
                    <option value="PROGRESSO" th:selected="${ticket.estado == 'PROGRESSO'}">Em progresso</option>
                    <option value="RESOLVIDO" th:selected="${ticket.estado == 'RESOLVIDO'}">Resolvido</option>
                  </select>
                </div>
                <button type="submit" class="button main mobile w-button"
                  style="width: auto; padding: 10px 40px; border: none; margin-top: 15px; background-color: var(--main); color: white;">Enviar</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <th:block th:replace="~{layout/fragments/scripts :: scripts}"></th:block>
  <script th:inline="javascript">
    document.getElementById('form-status-ticket').addEventListener('submit', function (e) {
      e.preventDefault();
      const ticketId = document.getElementById('ticketId').value;
      const estado = document.getElementById('estado').value;

      if (!estado) {
        Modal.error('Por favor, selecione um estado.');
        return;
      }

      const payload = { estado: estado };

      Modal.showLoading('A atualizar estado...');
      fetch(`/api/tickets/${ticketId}/estado`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(async res => {
          const data = await res.json();
          Modal.hideLoading();
          if (res.ok) {
            Modal.success(data.message || data.msg || 'Estado atualizado com sucesso!');
            
            // Atualizar a URL para refletir o novo estado sem recarregar a página
            const url = new URL(window.location);
            url.searchParams.set('estado', estado);
            window.history.replaceState({}, '', url);
            
            // Atualizar o label visual
            const labelContainer = document.querySelector('#w-node-_40601bc3-2220-c362-209c-44ddfe5d07fa-512eb52a');
            if (labelContainer) {
               const items = labelContainer.querySelectorAll('.list-item');
               // O estado é o terceiro item na lista visual
               if (items && items.length >= 6) {
                   const stateLabel = items[5]; // list-item-lable, list-item, list-item-lable, list-item, list-item-lable, list-item (estado)
                   if (estado === 'ABERTO') { stateLabel.className = 'list-item redd'; stateLabel.innerText = 'Aberto'; }
                   else if (estado === 'PROGRESSO') { stateLabel.className = 'list-item blue'; stateLabel.innerText = 'Em progresso'; }
                   else if (estado === 'RESOLVIDO') { stateLabel.className = 'list-item green'; stateLabel.innerText = 'Resolvido'; }
               }
            }
          } else {
            Modal.error(data.error || data.msg || 'Erro ao atualizar ticket');
          }
        })
        .catch(err => {
          Modal.hideLoading();
          Modal.error('Erro de rede ao atualizar ticket');
        });
    });
  </script>
</body>

</html>
