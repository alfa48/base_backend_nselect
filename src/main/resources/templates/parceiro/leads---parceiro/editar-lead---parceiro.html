<!DOCTYPE html><!--  Last Published: Sat Apr 25 2026 22:30:53 GMT+0000 (Coordinated Universal Time)  -->
<html data-wf-page="69ed2e96a5bc49a97118d330" data-wf-site="69ece585cad09a74baae0d40"
  xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/fragments/head :: head('Editar lead - Parceiro')}"></head>

<body>
  <div th:replace="~{layout/fragments/parceiro-nav :: nav}"></div>
  <section class="section-3 no-shad">
    <div class="horizontal-navigation">
      <div class="contain-this">
        <div class="div-block-455">
          <div class="div-block-456">
            <a href="javascript:history.back()" class="link-5">q</a>
            <div class="text-block-258">Novo lead</div>
          </div>
        </div>
      </div>
    </div>
    <div class="contain-this">
      <div class="div-block-504">
        <div class="w-form">
          <form id="form-editar-lead" name="email-form" method="post" enctype="multipart/form-data">
            <input type="hidden" id="leadPublicId" th:value="${lead.publicId}">
            <div class="criar-content-wrapper">
              <div class="form-field-wrapper">
                <label for="nome" class="form-field-lable">Nome</label>
                <input class="form-text-field w-input" name="nome" th:value="${lead.nome}" type="text" id="nome"
                  required>
              </div>
              <div class="form-field-wrapper">
                <label for="email" class="form-field-lable">Email</label>
                <input class="form-text-field w-input" name="email" th:value="${lead.email}" type="email" id="email"
                  required>
              </div>
              <div class="form-field-wrapper">
                <label for="telemovel" class="form-field-lable">Telemóvel</label>
                <input class="form-text-field w-input" name="telemovel" th:value="${lead.telemovel}" type="text"
                  id="telemovel" required>
              </div>
              <div class="form-field-wrapper">
                <label for="nif" class="form-field-lable">NIF</label>
                <input class="form-text-field w-input" name="nif" th:value="${lead.nif}" type="text" id="nif" required>
              </div>
              <div class="form-field-wrapper">
                <label for="pacotePublicId" class="form-field-lable">Pacote que o lead pretende comprar</label>
                <select id="pacotePublicId" name="pacotePublicId" class="select-field w-select" required>
                  <option value="">Selecione...</option>
                  <option th:each="p : ${pacotes}" th:value="${p.publicId}" th:text="${p.nome}"
                    th:selected="${lead.pacotePublicId == p.publicId}"></option>
                </select>
              </div>
              <div class="form-field-wrapper">
                <label for="estado" class="form-field-lable">Estado</label>
                <select id="estado" name="estado" class="select-field w-select" required>
                  <option value="LEAD" th:selected="${lead.estado == 'LEAD'}">Lead</option>
                  <option value="PENDENTE" th:selected="${lead.estado == 'PENDENTE'}">Pendente</option>
                  <option value="CONVERTIDO" th:selected="${lead.estado == 'CONVERTIDO'}">Convertido</option>
                  <option value="PERDIDO" th:selected="${lead.estado == 'PERDIDO'}">Perdido</option>
                </select>
              </div>

              <div class="photo-upload-input-wrapper">
                <label for="comprovativo" class="form-field-lable">Comprovativo (lead convertido)</label>
                <div class="photo-upload-input-field" id="upload-box" onclick="document.getElementById('comprovativo').click()"
                  style="cursor: pointer; position: relative; overflow: hidden; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #c9d7f0; border-radius: 8px; background-color: #f8fbff; transition: all 0.3s ease;">
                  
                  <div id="upload-placeholder" th:style="${lead.comprovativoUrl != null} ? 'display: none' : 'display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;'">
                    <div class="icon upload-icon" style="margin-bottom: 10px;">
                      <div class="main-font-icon">4</div>
                    </div>
                    <div class="photo-upload-text" id="file-name-display" style="margin-bottom: 4px;">Clique para fazer upload</div>
                    <div class="photo-upload-text small-gray">Ficheiro deve ter menos que 1MB</div>
                  </div>

                  <!-- Preview Integrado -->
                  <div id="integrated-preview"
                    th:style="${lead.comprovativoUrl != null} ? 'display: flex; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #fff; flex-direction: column; align-items: center; justify-content: center; padding: 10px;' : 'display:none;'">
                    
                    <div id="preview-pdf-icon"
                      style="padding: 10px 15px; background-color: #f8fbff; color: #0057b8; border: 1px solid #c9d7f0; border-radius: 6px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                      Comprovativo anexado
                    </div>
                    <div id="integrated-filename" th:text="${lead.comprovativoUrl != null ? 'Comprovativo' : ''}"
                      style="font-size: 13px; color: #667999; font-weight: 500; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90%; padding: 0 10px;">
                    </div>
                    <div style="margin-top: 10px; font-size: 11px; color: #007bff; text-decoration: underline;">Clique
                      para trocar</div>
                  </div>

                  <input type="file" id="comprovativo" name="comprovativo" style="display: none;" onchange="updateFileName(this)">
                </div>

                <div th:if="${lead.comprovativoUrl != null}" style="margin-top: 15px; display: flex; justify-content: flex-end;">
                  <a th:href="${lead.comprovativoUrl.startsWith('http') ? lead.comprovativoUrl : '/' + lead.comprovativoUrl}" target="_blank" 
                     class="action-button w-inline-block" style="padding: 8px 16px; background-color: #eaf1fa; color: #0057b8; border-radius: 6px; text-decoration: none; display: flex; align-items: center; gap: 8px;">
                    <div class="main-font-icon" style="font-size: 16px; margin: 0;">8</div>
                    <div style="font-size: 14px; font-weight: 500;">Baixar Comprovativo Atual</div>
                  </a>
                </div>
              </div>

              <div class="create-this">
                <button type="submit" class="button main mobile w-button">Salvar</button>
              </div>
            </div>
          </form>

          <script>
            function updateFileName(input) {
              const file = input.files[0];
              if (file) {
                document.getElementById('upload-placeholder').style.display = 'none';
                document.getElementById('integrated-preview').style.display = 'flex';
                document.getElementById('integrated-filename').innerText = file.name;
              }
            }

            document.getElementById('form-editar-lead').addEventListener('submit', function (e) {
              e.preventDefault();
              const leadId = document.getElementById('leadPublicId').value;
              const formData = new FormData(this);

              const dados = {
                nome: formData.get('nome'),
                email: formData.get('email'),
                telemovel: formData.get('telemovel'),
                nif: formData.get('nif'),
                pacotePublicId: formData.get('pacotePublicId'),
                estado: formData.get('estado')
              };

              const multipartData = new FormData();
              multipartData.append('dados', JSON.stringify(dados));
              if (formData.get('comprovativo')) {
                multipartData.append('comprovativo', formData.get('comprovativo'));
              }

              Modal.showLoading('A actualizar lead...');

              fetch('/api/leads/' + leadId, {
                method: 'PUT',
                body: multipartData
              })
                .then(res => res.json())
                .then(data => {
                  Modal.hideLoading();
                  if (data.message) {
                    Modal.toast(data.message);
                    setTimeout(() => { window.location.href = '/parceiro/leads/' + leadId; }, 1500);
                  } else {
                    Modal.error(data.error || 'Erro ao atualizar lead');
                  }
                })
                .catch(err => {
                  Modal.hideLoading();
                  Modal.error('Erro de rede');
                });
            });
          </script>
        </div>
      </div>
      <div class="div-block-106" style="margin-top: 15px;">
        <button type="button" class="action-button cncel w-inline-block btn-delete-lead" th:data-id="${lead.publicId}">
          <div class="icon quick-action">
            <div class="main-font-icon" style="color: #ff5b5b;">v</div>
            <div class="button-text quick-action-text" style="color: #ff5b5b;">Apagar</div>
          </div>
        </button>
      </div>
    </div>
  </section>
  <th:block th:replace="~{layout/fragments/scripts :: scripts}"></th:block>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.btn-delete-lead').forEach(btn => {
        btn.addEventListener('click', function () {
          const leadId = this.getAttribute('data-id');
          Modal.deleteItem(leadId, `/api/leads/${leadId}`, 'este lead', () => {
            window.location.href = '/parceiro/leads';
          });
        });
      });
    });
  </script>
</body>

</html>
