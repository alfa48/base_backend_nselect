<!DOCTYPE html><!--  Last Published: Sat Apr 25 2026 22:30:53 GMT+0000 (Coordinated Universal Time)  -->
<html data-wf-page="69ed37b34104ad1d7843c106" data-wf-site="69ece585cad09a74baae0d40" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments/head :: head('Editar Ticket - Parceiro')}"></head>
<body>
  <div th:replace="~{layout/fragments/parceiro-nav :: nav}"></div>
  <section class="section-3 no-shad">
    <div class="horizontal-navigation">
      <div class="contain-this">
        <div class="div-block-455">
          <div class="div-block-456">
            <a href="javascript:history.back()" class="link-5">q</a>
            <div class="text-block-258">Editar Ticket</div>
          </div>
        </div>
      </div>
    </div>
    <div class="contain-this">
      <div class="div-block-504">
        <div class="w-form">
          <form id="form-editar-ticket" method="post" enctype="application/json">
            <input type="hidden" id="ticketPublicId" th:value="${ticket.publicId}">
            <div class="criar-content-wrapper">
              <div class="form-field-wrapper">
                <label for="tipo" class="form-field-lable">Tipo</label>
                <select id="tipo" name="tipo" class="select-field w-select" required>
                  <option value="">Selecione...</option>
                  <option value="BUG" th:selected="${ticket.tipo == 'BUG'}">Bug no sistema</option>
                  <option value="CANCELAR" th:selected="${ticket.tipo == 'CANCELAR'}">Cancelar subscrição</option>
                  <option value="RECLAMACAO" th:selected="${ticket.tipo == 'RECLAMACAO'}">Reclamação</option>
                  <option value="OUTRO" th:selected="${ticket.tipo == 'OUTRO'}">Outro</option>
                </select>
              </div>
              <div class="form-field-wrapper">
                <label for="conteudo" class="form-field-lable">Descrição</label>
                <textarea placeholder="Descrição..." maxlength="5000" id="conteudo" name="conteudo" required class="form-text-field _2 _888 w-input" th:text="${ticket.conteudo}"></textarea>
              </div>
              <div class="create-this">
                <button type="submit" class="button main mobile w-button">Salvar</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
  <th:block th:replace="~{layout/fragments/scripts :: scripts}"></th:block>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('form-editar-ticket');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const ticketId = document.getElementById('ticketPublicId').value;
        const formData = new FormData(this);
        const dados = {
          tipo: formData.get('tipo'),
          conteudo: formData.get('conteudo')
        };
        
        Modal.showLoading('A atualizar ticket...');
        fetch(`/api/tickets/${ticketId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dados)
        })
        .then(res => res.json())
        .then(data => {
          Modal.hideLoading();
          if (data.message) {
            Modal.toast(data.message);
            setTimeout(() => { window.location.href = '/parceiro/tickets/' + ticketId; }, 1500);
          } else {
            Modal.error(data.error || 'Erro ao atualizar ticket');
          }
        })
        .catch(err => {
          Modal.hideLoading();
          Modal.error('Erro de rede');
        });
      });
    });
  </script>
</body>
</html>
