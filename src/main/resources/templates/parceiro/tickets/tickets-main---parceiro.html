<!DOCTYPE html><!--  Last Published: Sat Apr 25 2026 22:30:53 GMT+0000 (Coordinated Universal Time)  -->
<html data-wf-page="69ed34a962f2384d85097d14" data-wf-site="69ece585cad09a74baae0d40"
  xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/fragments/head :: head('Ticket - Parceiro')}"></head>

<body>
  <div th:replace="~{layout/fragments/parceiro-nav :: nav}"></div>
  <section class="section-3 no-shad _500">
    <div class="horizontal-navigation">
      <div class="contain-this">
        <div class="div-block-455">
          <div class="div-block-456">
            <a href="javascript:history.back()" class="link-5">q</a>
            <div class="text-block-258">Tickets</div>
            <form action="/search" class="search w-form"><input class="search-input w-input" maxlength="256"
                name="query" placeholder="Pesquisar" type="search" id="search" required=""><input type="submit"
                class="search-button w-button" value="x"></form>
          </div>
            <div class="form-block-2 w-form">
              <form id="filter-form" class="form-3">
                <select id="filter-tipo" class="select-field-2 _2 w-select" style="margin-right: 10px;">
                  <option value="">Todos os Tipos</option>
                  <option value="BUG">Bug no sistema</option>
                  <option value="CANCELAR">Cancelar subscrição</option>
                  <option value="RECLAMACAO">Reclamação</option>
                  <option value="OUTRO">Outro</option>
                </select>
                <a th:href="@{/parceiro/tickets/novo}" class="link-43">Novo ticket</a>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="contain-this">
      <div class="_8" id="tickets-container">
        <!-- Iterar Tickets -->
        <th:block th:each="ticket : ${tickets.content}">
          <div class="main-card ticket-card" th:data-tipo="${ticket.tipo}">
            <a th:href="@{/parceiro/tickets/{id}(id=${ticket.publicId}, conteudo=${ticket.conteudo}, tipo=${ticket.tipo}, estado=${ticket.estado}, publicadoPorNome=${ticket.publicadoPorNome})}"
              class="main-items-of-card w-inline-block">
              <div class="icon-div">
                <div class="text-block-255">2</div>
              </div>
              <div class="content-do-card-div">
                <div class="text-block-256 main ticket-conteudo" th:text="${#strings.abbreviate(ticket.conteudo, 30)}">Parte do conteudo
                  do ticket</div>
              </div>
              <div class="content-do-card-div">
                <div class="text-block-256 ticket-tipo-label" th:text="${ticket.tipo}">Tipo</div>
              </div>
              <div class="content-do-card-div status-things">
                <div class="status-wrapper"
                  th:classappend="${#strings.toLowerCase(ticket.estado) == 'resolvido' ? 'pago' : (#strings.toLowerCase(ticket.estado) == 'aberto' ? 'reembolso' : 'nao-pago')}">
                  <div class="status-text" th:text="${ticket.estado}">em progresso</div>
                </div>
              </div>
            </a>
            <div class="options-side">
              <a th:href="@{/parceiro/tickets/{id}(id=${ticket.publicId}, conteudo=${ticket.conteudo}, tipo=${ticket.tipo}, estado=${ticket.estado}, publicadoPorNome=${ticket.publicadoPorNome})}"
                class="link-4">8</a>
            </div>
          </div>
        </th:block>

        <div th:if="${#lists.isEmpty(tickets.content)}" class="text-block-256"
          style="text-align: center; padding: 40px; opacity: 0.6;">
          Nenhum ticket encontrado.
        </div>
        <div id="no-results-filter" class="text-block-256" style="text-align: center; padding: 40px; opacity: 0.6; display: none;">
          Nenhum ticket corresponde ao filtro.
        </div>

        <!-- Paginação -->
        <div th:if="${tickets.totalPages > 1}" class="pagination-wrapper" style="display: flex; justify-content: center; gap: 15px; margin-top: 20px;">
          <a th:href="@{/parceiro/tickets(pagina=${tickets.number - 1})}" th:if="${tickets.number > 0}" class="action-button w-button" style="padding: 8px 15px; background-color: #f8fbff; color: #007bff; border: 1px solid #c9d7f0;">Anterior</a>
          <span style="align-self: center; font-size: 13px; color: #667999;" th:text="${'Página ' + (tickets.number + 1) + ' de ' + tickets.totalPages}">Página 1</span>
          <a th:href="@{/parceiro/tickets(pagina=${tickets.number + 1})}" th:if="${tickets.number + 1 < tickets.totalPages}" class="action-button w-button" style="padding: 8px 15px; background-color: #f8fbff; color: #007bff; border: 1px solid #c9d7f0;">Próxima</a>
        </div>
      </div>
    </div>
  </section>
  <section class="section-4">
    <a th:href="@{/parceiro/tickets/novo}" class="button-6 w-button">Novo Ticket</a>
  </section>
  <th:block th:replace="~{layout/fragments/scripts :: scripts}"></th:block>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const searchInput = document.getElementById('search');
      const filterTipo = document.getElementById('filter-tipo');
      const cards = document.querySelectorAll('.ticket-card');
      const noResultsMsg = document.getElementById('no-results-filter');

      function filterTickets() {
        const query = searchInput.value.toLowerCase();
        const tipoSelected = filterTipo.value;
        let countVisible = 0;

        cards.forEach(card => {
          const conteudo = card.querySelector('.ticket-conteudo').innerText.toLowerCase();
          const tipo = card.getAttribute('data-tipo');
          
          const matchQuery = conteudo.includes(query);
          const matchTipo = tipoSelected === '' || tipo === tipoSelected;
          
          if (matchQuery && matchTipo) {
            card.style.display = 'flex';
            countVisible++;
          } else {
            card.style.display = 'none';
          }
        });

        if (cards.length > 0) {
          noResultsMsg.style.display = countVisible === 0 ? 'block' : 'none';
        }
      }

      searchInput.addEventListener('input', filterTickets);
      filterTipo.addEventListener('change', filterTickets);
      
      const searchForm = searchInput.closest('form');
      if (searchForm) {
        searchForm.addEventListener('submit', function(e) {
          e.preventDefault();
          filterTickets();
        });
      }
    });
  </script>
</body>

</html>
